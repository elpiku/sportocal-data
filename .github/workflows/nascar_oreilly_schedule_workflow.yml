name: Update NASCAR O'Reilly Auto Parts Series Schedule

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run NASCAR O'Reilly Auto Parts Series Scraper
        run: python scripts/nascar_oreilly.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add motorsport/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update NASCAR O'Reilly Auto Parts Series schedule [skip ci]" && git push)
