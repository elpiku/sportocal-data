name: WRC Data Scraper

on:
  workflow_dispatch:
    # Allow manual trigger

jobs:
  scrape-wrc:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
      
      - name: Run WRC scraper
        run: |
          python scripts/wrc_scraper.py

      - name: Rebuild index.json
        run: |
          python scripts/build_index.py
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@github.com"
          git config --local user.name "github-actions[bot]"
          git add motorsport/wrc/ index.json
          git diff --quiet && git diff --staged --quiet && exit 0
          git commit -m "Update WRC data $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (another workflow likely pushed first) - pulling and retrying ($i/5)..."
            git pull --rebase origin main
            sleep $((RANDOM % 10 + 1))
          done
          echo "Failed to push after 5 attempts" >&2
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}