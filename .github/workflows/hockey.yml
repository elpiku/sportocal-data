name: Scrape Hockey Schedules

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-hockey:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run unified hockey scraper
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          python scripts/hockey_generic.py

      - name: Rebuild index.json
        run: |
          python scripts/build_index.py

      - name: Commit and push updated schedules
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hockey/ index.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(hockey): update NHL and international hockey schedules [skip ci]"
            for i in 1 2 3 4 5; do
              git push && exit 0
              git pull --rebase origin main
              sleep $((RANDOM % 10 + 1))
            done
            exit 1
          fi
