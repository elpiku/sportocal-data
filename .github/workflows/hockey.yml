name: Scrape Hockey Schedules

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-hockey:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-dateutil pytz pypdf

      - name: Run unified hockey scraper
        run: |
          python scripts/hockey_generic.py

      - name: Rebuild index.json
        run: |
          python scripts/build_index.py

      - name: Commit and push updated schedules
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hockey/ index.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(hockey): update NHL and international hockey schedules"
            git push origin main
          fi
