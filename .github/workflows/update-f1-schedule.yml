name: Update F1 Schedule

on:
  schedule:
    - cron: '0 */6 * * *'   # roughly every 6 hours
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scraper
        run: python scripts/scrape_f1.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add motorsport/f1/2026.json
          if git diff --cached --quiet; then
            echo "No schedule changes detected."
          else
            git commit -m "Auto-update F1 2026 schedule ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
