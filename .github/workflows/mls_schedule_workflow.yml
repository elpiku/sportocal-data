name: Update MLS Schedule

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run MLS Scraper
        run: python scripts/mls.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add football/mls/
          git diff --quiet && git diff --staged --quiet && exit 0
          git commit -m "Auto-update MLS schedule [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (another workflow likely pushed first) - pulling and retrying ($i/5)..."
            git pull --rebase origin main
            sleep $((RANDOM % 10 + 1))
          done
          echo "Failed to push after 5 attempts" >&2
          exit 1
