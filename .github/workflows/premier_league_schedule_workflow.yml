name: Update Premier League Schedule (football-data.org)

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - run: pip install -r scripts/requirements.txt

      - name: Run Premier League scraper
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python scripts/premier_league.py

      - name: Rebuild index
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python scripts/build_index.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add football/premierleague/ index.json
          git diff --quiet && git diff --staged --quiet && exit 0
          git commit -m "Auto-update Premier League schedule [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected - retrying ($i/5)..."
            git pull --rebase -X ours origin main || git rebase --abort
            sleep $((RANDOM % 10 + 1))
          done
          exit 1
