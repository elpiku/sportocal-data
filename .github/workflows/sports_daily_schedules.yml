name: Daily Sports Data Update (API-Sports)

# Master daily workflow that refreshes all API-Sports-powered sports:
# american football, hockey, rugby, tennis, MMA, volleyball, handball, baseball, AFL.
# Football and basketball have their own dedicated workflows.

on:
  schedule:
    - cron: '0 5 * * *'   # daily at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-all-sports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - run: pip install -r scripts/requirements.txt

      - name: American Football (NFL + NCAA)
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/american_football_generic.py

      - name: Ice Hockey (NHL, PWHL, IIHF)
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/hockey_generic.py

      - name: Rugby (Six Nations, Super Rugby, NRL, etc.)
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/rugby_generic.py

      - name: Tennis (ATP, WTA)
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/tennis_generic.py

      - name: MMA (UFC, PFL, Bellator)
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/mma_generic.py

      - name: Volleyball
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/volleyball_generic.py

      - name: Handball
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/handball_generic.py

      - name: Baseball (MLB, NPB, KBO, College)
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/baseball_generic.py

      - name: AFL (Australian Football)
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/australian_football_generic.py

      - name: Rebuild index
        run: python scripts/build_index.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add american-football/ hockey/ rugby/ tennis/ mma/ volleyball/ handball/ baseball/ australian-football/ index.json
          git diff --quiet && git diff --staged --quiet && exit 0
          git commit -m "Auto-update daily sports schedules [skip ci]"
          for i in $(seq 1 10); do
            git push && exit 0
            echo "Push rejected - retrying ($i/10)..."
            git pull --rebase origin main
            sleep $((RANDOM % 15 + 1))
          done
          exit 1
