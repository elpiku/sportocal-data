name: Update All Basketball Leagues (API-Sports + BALLDONTLIE)

on:
  schedule:
    - cron: '0 8 * * *'   # daily at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - run: pip install -r scripts/requirements.txt

      - name: NBA (BALLDONTLIE)
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: python scripts/nba.py

      - name: Other basketball leagues (API-Sports)
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/basketball_generic.py

      - name: Rebuild index
        run: python scripts/build_index.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add basketball/ index.json
          git diff --quiet && git diff --staged --quiet && exit 0
          git commit -m "Auto-update basketball schedules [skip ci]"
          for i in $(seq 1 10); do
            git push && exit 0
            git pull --rebase origin main
            sleep $((RANDOM % 15 + 1))
          done
          exit 1
