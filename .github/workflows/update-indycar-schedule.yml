name: Update IndyCar Schedule

on:
  workflow_dispatch: {}     # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scraper
        run: python scripts/scrape_indycar.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add motorsport/indycar/ntt/2026.json
          if git diff --cached --quiet; then
            echo "No schedule changes detected."
            exit 0
          fi
          git commit -m "Auto-update IndyCar 2026 schedule ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (another workflow likely pushed first) - pulling and retrying ($i/5)..."
            git pull --rebase origin main
            sleep $((RANDOM % 10 + 1))
          done
          echo "Failed to push after 5 attempts" >&2
          exit 1
