name: Update NBA Schedule (BALLDONTLIE)

on:
  schedule:
    - cron: '0 7 * * *'   # daily at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - run: pip install -r scripts/requirements.txt

      - name: Run NBA scraper (BALLDONTLIE)
        env:
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
        run: python scripts/nba.py

      - name: Rebuild index
        run: python scripts/build_index.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add basketball/nba/ index.json
          git diff --quiet && git diff --staged --quiet && exit 0
          git commit -m "Auto-update NBA schedule [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin main
            sleep $((RANDOM % 10 + 1))
          done
          exit 1
